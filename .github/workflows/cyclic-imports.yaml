# Cyclic import detection workflow.
# Tests that the package can be imported without circular dependencies.
# Validates key modules and submodules can be imported successfully.

name: Cyclic Imports
on:
  workflow_call:
  workflow_dispatch:  # to trigger manually

permissions:
  contents: read

jobs:
  cyclic-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v6

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@v0.0.4

      # Test main module imports to detect circular dependencies
      - name: check mlev
        run: |
          python -c "import mlev"

      # Test functional module imports
      - name: check mlev.functional
        run: |
          python -c "from mlev import functional"
      - name: check mlev.functional.array
        run: |
          python -c "from mlev.functional import array"
      - name: check mlev.functional.frame
        run: |
          python -c "from mlev.functional import frame"

      # Test metrics module imports
      - name: check mlev.metrics
        run: |
          python -c "from mlev import metrics"
      - name: check mlev.metrics.array
        run: |
          python -c "from mlev.metrics import array"
      - name: check mlev.metrics.frame
        run: |
          python -c "from mlev.metrics import frame"

      # Test result module imports
      - name: check mlev.results
        run: |
          python -c "from mlev import results"

      # Test testing module imports
      - name: check mlev.testing
        run: |
          python -c "from mlev import testing"

      # Test utils module imports
      - name: check mlev.utils
        run: |
          python -c "from mlev import utils"
